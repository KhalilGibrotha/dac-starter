StylesPath = dac/vale/styles
MinAlertLevel = warning

Vocab = ArchitectureDocs
Packages = RedHat, write-good, https://github.com/tbhb/vale-ai-tells/releases/download/v1.25.0/ai-tells.zip

[*.md]
BasedOnStyles = DocOps, RedHat, write-good, ai-tells

# Tuned for enterprise documentation prose
RedHat.Definitions = NO
RedHat.EmDash = suggestion
RedHat.Headings = NO
RedHat.PassiveVoice = NO
RedHat.ReadabilityGrade = NO
RedHat.SentenceLength = suggestion
RedHat.TermsWarnings = suggestion
write-good.Passive = NO
write-good.TooWordy = suggestion
write-good.E-Prime = NO

# ai-tells (AI-prose detection) — advisory. The punctuation-frequency rules
# fire on ordinary enterprise prose, so the ones covered elsewhere or noisy
# for formal writing are muted; the high-signal lexical and structural rules
# stay on (OverusedVocabulary, HedgingPhrases, FormalTransitions, tricolons,
# ServesAsDodge, ContrastiveNegation).
ai-tells.EmDashUsage = NO      # RedHat.EmDash already covers em-dashes
ai-tells.ColonUsage = NO       # colons are normal technical punctuation
ai-tells.SemicolonUsage = NO   # semicolons are normal technical punctuation
ai-tells.FormalRegister = NO   # formal register is the house voice
ai-tells.VerbTricolon = suggestion  # flags genuine three-item enumerations too

# Skip YAML front matter and inline code
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (`[^`]*`)

[dac/vale/styles/**.md]
BasedOnStyles =

[dac/templates/*.md]
RedHat.Headings = NO
RedHat.ReadabilityGrade = NO
write-good.Passive = NO
