name: Lint

on:
  pull_request:
  push:
    branches:
      - main

# Every job runs inside the published toolchain image — the same tools, same
# versions, as the Dev Spaces workspace. No per-job installs to drift.
jobs:
  frontmatter:
    name: Front matter validation
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - run: lint-frontmatter.py --path .

  mermaid:
    name: Mermaid preflight
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - run: lint-mermaid.py --path .

  encoding:
    name: Encoding artifacts
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - run: lint-encoding.py --path .

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - run: markdownlint-cli2 "**/*.md" "!dac/vale" "!exports" "!archive"

  vale:
    name: Vale prose lint (advisory)
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Vale packages
        run: vale sync
      - name: Run Vale
        # Advisory: findings appear in the log without failing the job.
        # Tighten to blocking once the team has tuned the rules.
        run: vale docs/ decisions/ governance/ initiatives/ patterns/ references/ || true
