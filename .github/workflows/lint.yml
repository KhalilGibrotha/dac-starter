name: Lint

on:
  pull_request:
  push:
    branches:
      - main

# Rapid successive pushes to the same branch supersede each other; running CI
# on a commit that is no longer the head answers a question nobody is asking.
# Cancelling the stale run is where CI compute is saved.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Every content job runs inside the published toolchain image — the same
# tools, same versions, as the Dev Spaces workspace. No per-job installs to
# drift. Each job tees its output and appends the tool's own result line to
# the run summary, so the PR answers what happened, not just whether.
jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    # Plain runner, not the container: gitleaks is not part of the toolkit
    # image. The gitleaks BINARY is MIT and free; only the gitleaks-action
    # wrapper demands GITLEAKS_LICENSE, and it does so for any repo owned by
    # an organization — failing at the licence check without ever scanning.
    # Installing the binary keeps this job identical in a personal repo and
    # an org-owned one. Pinned: a floating version could add rules and fail
    # CI unannounced.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # `git` scans history; fetch-depth 0 above is what makes that
      # meaningful. --redact keeps any finding out of the log.
      - name: Scan for secrets
        run: |
          set -o pipefail
          gitleaks git . --redact --verbose 2>&1 | tee gate-out.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Secret scan - ${{ job.status }}"
            grep -aE "commits scanned|leaks" gate-out.txt | sed $'s/\\x1b\\[[0-9;]*m//g' | tail -n 2 || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  frontmatter:
    name: Front matter validation
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate front matter
        run: |
          set -o pipefail
          lint-frontmatter.py --path . 2>&1 | tee gate-out.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Front matter validation - ${{ job.status }}"
            grep -aE "Checked .* file" gate-out.txt | tail -n 1 || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  mermaid:
    name: Mermaid preflight
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Mermaid fences
        run: |
          set -o pipefail
          lint-mermaid.py --path . 2>&1 | tee gate-out.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Mermaid preflight - ${{ job.status }}"
            grep -aE "Checked .* file" gate-out.txt | tail -n 1 || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  encoding:
    name: Encoding artifacts
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for mojibake, smart quotes, non-breaking spaces
        run: |
          set -o pipefail
          lint-encoding.py --path . 2>&1 | tee gate-out.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Encoding artifacts - ${{ job.status }}"
            grep -aE "Checked .* file|artifact" gate-out.txt | tail -n 1 || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint-cli2
        run: |
          set -o pipefail
          markdownlint-cli2 "**/*.md" "!dac/vale" "!exports" "!archive" 2>&1 | tee gate-out.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Markdown lint - ${{ job.status }}"
            grep -aE "^Linting:|^Summary:" gate-out.txt | tail -n 2 || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  vale:
    name: Vale prose lint (advisory)
    runs-on: ubuntu-latest
    container: ghcr.io/khalilgibrotha/dac-toolkit:latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Vale packages
        run: vale sync

      # lint-prose.py ships in the image. One Vale run in JSON mode rendered
      # three ways: the per-finding log, a per-document table on the run
      # summary (worst documents first), and a headline score - percent of
      # documents error-free. Advisory on findings (--no-exit), honest about
      # failure: a Vale that cannot run (missing styles, bad config) exits
      # >= 2 and fails the job, because it has checked nothing. The script
      # writes its own summary section, so no trailer step is needed.
      - name: Run Vale
        run: lint-prose.py --no-exit
