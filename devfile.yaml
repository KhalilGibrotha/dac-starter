schemaVersion: 2.2.0
metadata:
  name: dac-starter
  displayName: Documentation as Code (starter)
  description: >
    Authoring workspace for this content repo. It consumes the pre-built
    dac-toolkit image — docx_builder, Pandoc, Mermaid CLI, Vale, markdownlint,
    pre-commit, and the lint scripts are baked in. No toolkit clone, no
    runtime install. Paste this repo's Git URL into OpenShift Dev Spaces.

# Drop-in "content repo" devfile: the workspace = the published toolchain
# image + this repo's content. There is intentionally no projects: section —
# the Dev Spaces factory clones this repo itself.

components:
  - name: tools
    container:
      # Pin to an immutable tag (:<sha>) for reproducibility once you adopt
      # this in earnest; :latest is fine while iterating.
      image: ghcr.io/khalilgibrotha/dac-toolkit:latest
      memoryRequest: 1Gi
      # Set this to what your namespace actually grants. Claiming more than
      # the quota allows buys no headroom - the workspace is still killed at
      # the real ceiling, just with a devfile that says otherwise.
      memoryLimit: 4Gi
      cpuRequest: 500m
      cpuLimit: "2"
      mountSources: true
      sourceMapping: /projects
      env:
        # Two settings that keep commits from killing the workspace. Both were
        # found the hard way; neither is optional in a memory-capped cluster.
        #
        # Node sizes its heap from the HOST node's RAM, not this container's
        # limit, so markdownlint-cli2 running as a pre-commit hook will grow
        # past memoryLimit and get the workspace OOM-killed. Capping it makes
        # an oversized run fail with a readable error instead.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        # pre-commit caches hook environments under $HOME, which is ephemeral
        # here - only sourceMapping (/projects) is on the persistent volume.
        # Left at the default, every workspace restart re-runs npm install for
        # the hook environments on your next commit, which is the single most
        # reliable way to exhaust a 4Gi workspace. On the PVC it installs once.
        - name: PRE_COMMIT_HOME
          value: /projects/.pre-commit-cache

commands:
  - id: build-changed
    exec:
      label: "Build changed documents (docx-build-all)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: docx-build-all
      group:
        kind: build
        isDefault: true
  - id: build-all-force
    exec:
      label: "Build ALL documents (docx-build-all --force)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: docx-build-all --force
      group:
        kind: build
  - id: lint-frontmatter
    exec:
      label: "Validate YAML front matter"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: lint-frontmatter.py --path .
      group:
        kind: test
        isDefault: true
  - id: lint-mermaid
    exec:
      label: "Mermaid diagram preflight"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: lint-mermaid.py --path .
      group:
        kind: test
  - id: lint-encoding
    exec:
      label: "Encoding artifacts check"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: lint-encoding.py --path .
      group:
        kind: test
  - id: lint-prose
    exec:
      label: "Prose style (Vale, advisory)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: vale sync && vale docs/ decisions/ governance/ initiatives/ patterns/ references/ || true
      group:
        kind: test
